model_family: additive

features:
  numeric_continuous:
    - RevolvingUtilizationOfUnsecuredLines
    - DebtRatio
    - MonthlyIncome
    - NumberOfOpenCreditLinesAndLoans
    - NumberRealEstateLoansOrLines
    - NumberOfDependents
    - NumberOfTime30-59DaysPastDueNotWorse
    - NumberOfTime60-89DaysPastDueNotWorse
    - NumberOfTimes90DaysLate
  categorical_nominal: []
  categorical_ordinal: []

protected_attributes:
  - age

imputation_policy:
  numeric:
    - max_share: 0.10
      strategy: median
      add_indicator: false
    - max_share: 0.40
      strategy: median
      add_indicator: true
    - max_share: 1.00
      strategy: constant
      fill_value: 0
      add_indicator: true
  categorical:
    - max_share: 0.10
      strategy: most_frequent
      add_indicator: false
    - max_share: 1.00
      strategy: constant
      fill_value: "Missing"
      add_indicator: false

transform_policy:
  additive:
    numeric_continuous:
      - log1p
      - standard_scaler
    categorical_nominal:
      - woe
    categorical_ordinal:
      - ordinal_encoder
      - standard_scaler
  partitioning:
    numeric_continuous:
      - winsorize
    categorical_nominal:
      - one_hot
    categorical_ordinal:
      - ordinal_encoder